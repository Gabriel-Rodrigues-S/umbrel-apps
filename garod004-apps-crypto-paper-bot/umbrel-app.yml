manifestVersion: 1
id: garod004-apps-crypto-paper-bot
name: Crypto Paper Bot
tagline: Bot de trading de criptomoedas em modo simulado (paper trading)
icon: https://raw.githubusercontent.com/garod004/umbrel-apps/main/garod004-apps-crypto-paper-bot/icon.svg
category: finance
version: '1.2.1'
port: 3458
description: >-
  Bot de trading automático que opera com dinheiro simulado usando preços reais
  da Binance. Crie bots com 4 estratégias (SMA crossover, MACD crossover, RSI
  reversão, Bandas de Bollinger), cada uma filtrada por ADX pra só operar no
  regime de mercado certo (tendência ou lateral). Acompanhe saldo, posições e
  histórico de trades em um dashboard. Nenhuma ordem real é enviada — é uma
  ferramenta de estudo e teste de estratégias.
developer: garod004
website: https://github.com/garod004/umbrel-apps
