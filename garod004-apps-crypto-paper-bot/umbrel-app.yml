releaseNotes: >-
  v1.1.0: adiciona 3 novas estratégias (MACD crossover, RSI reversão, Bandas de
  Bollinger) e filtro de ADX que só deixa cada estratégia operar no regime de
  mercado em que ela funciona (tendência ou lateral), reduzindo overtrading em
  mercado sem direção clara.
