releaseNotes: >-
  v1.2.1: motor de trading passa a checar sinais a cada 10s (era 30s), o que
  também permite reagir ao candle ainda em formação em vez de esperar ele
  fechar. Dashboard atualiza a cada 2s (era 15s). Inclui também o gráfico de
  preço com marcações de compra/venda da v1.2.0.
