releaseNotes: >-
  v1.4.5: o PnL de cada trade agora é líquido das DUAS taxas (antes descontava só a de saída, então a soma dos PnL dos trades superestimava o resultado pela soma das taxas de entrada, e a taxa de acerto aparecia inflada). O saldo/equity dos bots não muda — ele já era correto. Os trades antigos são corrigidos automaticamente na primeira subida, uma única vez.
  v1.4.4: imagem fixada na tag 1.4.3 (o mesmo build que já está instalado); mudanças na :latest não afetam mais este app. Sem mudanças de funcionamento.
  v1.4.3: imagem do app migrada para o novo registro (ghcr.io/gabriel-rodrigues-s); sem mudanças de funcionamento.
  v1.4.2: corrige bug que impedia qualquer operação de short — ao abrir um
  short o motor quebrava no cálculo do equity e desfazia a operação, então
  os bots Short e Long+Short nunca operavam. Agora abrem, fecham e alternam
  entre long e short normalmente.
