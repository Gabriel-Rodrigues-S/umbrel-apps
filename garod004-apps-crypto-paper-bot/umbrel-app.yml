releaseNotes: >-
  v1.3.0: adiciona ticker de preço em tempo real (estilo TradingView) no
  detalhe de cada bot, com variação de 24h. Adiciona confirmação de sinal
  configurável por bot: persistência (exige N checagens seguidas com o mesmo
  sinal) ou timeframe maior (exige que um timeframe superior concorde com a
  direção), reduzindo entradas em falso (whipsaw).
