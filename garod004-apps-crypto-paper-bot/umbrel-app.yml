releaseNotes: >-
  v1.5.0: duas estratégias novas de baixa frequência, pensadas para o gráfico diário — "Preço acima da média" (fica comprado enquanto o fechamento estiver acima da média) e "Rompimento de canal" (compra quando o fechamento supera a máxima das últimas N velas e sai quando perde a mínima de N/2). Diferente das outras, elas decidem só no fechamento da vela e não usam o filtro de ADX. Novos timeframes de 30m e 1d na tela. Os bots existentes não mudam de comportamento.
  v1.4.8: a aba do navegador agora mostra o ícone do app em vez do ícone genérico.
  v1.4.7: a lista de bots ficou praticamente instantânea (antes a tela consultava a exchange uma vez por bot a cada atualização; com 24 bots isso levava ~22s — agora lê o preço e o ADX que o motor já calcula a cada ciclo). Novo modo de confirmação "sem confirmação", que entra no primeiro sinal e serve de grupo de controle. A confirmação por timeframe maior passa a ser recusada em RSI e Bandas de Bollinger, onde ela nunca teve efeito.
  v1.4.6: a lista de bots agora pode ser reordenada arrastando pela alça à esquerda de cada linha. A ordem escolhida fica salva e vale para os próximos acessos. Nenhuma mudança na lógica de operação dos bots.
  v1.4.5: o PnL de cada trade agora é líquido das DUAS taxas (antes descontava só a de saída, então a soma dos PnL dos trades superestimava o resultado pela soma das taxas de entrada, e a taxa de acerto aparecia inflada). O saldo/equity dos bots não muda — ele já era correto. Os trades antigos são corrigidos automaticamente na primeira subida, uma única vez.
  v1.4.4: imagem fixada na tag 1.4.3 (o mesmo build que já está instalado); mudanças na :latest não afetam mais este app. Sem mudanças de funcionamento.
  v1.4.3: imagem do app migrada para o novo registro (ghcr.io/gabriel-rodrigues-s); sem mudanças de funcionamento.
  v1.4.2: corrige bug que impedia qualquer operação de short — ao abrir um
  short o motor quebrava no cálculo do equity e desfazia a operação, então
  os bots Short e Long+Short nunca operavam. Agora abrem, fecham e alternam
  entre long e short normalmente.
