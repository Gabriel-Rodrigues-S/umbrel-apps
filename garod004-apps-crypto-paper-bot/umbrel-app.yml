manifestVersion: 1
id: garod004-apps-crypto-paper-bot
name: Crypto Paper Bot
tagline: Bot de trading de criptomoedas em modo simulado (paper trading)
icon: https://raw.githubusercontent.com/Gabriel-Rodrigues-S/umbrel-apps/main/garod004-apps-crypto-paper-bot/icon.svg
category: finance
version: '1.5.0'
port: 3458
description: >-
  Bot de trading automático que opera com dinheiro simulado usando preços reais
  da Binance. Crie bots com 6 estratégias: SMA crossover, MACD crossover, RSI
  reversão e Bandas de Bollinger (filtradas por ADX pra só operar no regime
  de mercado certo), mais Preço acima da média e Rompimento de canal (baixa
  frequência, decidem no fechamento da vela). Acompanhe saldo, posições e
  histórico de trades em um dashboard. Nenhuma ordem real é enviada — é uma
  ferramenta de estudo e teste de estratégias.
