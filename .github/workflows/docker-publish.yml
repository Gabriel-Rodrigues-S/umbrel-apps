name: Publicar imagens Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# O ghcr.io exige o nome do repositório em minúsculas; github.repository_owner
# vem com a capitalização da conta (Gabriel-Rodrigues-S) e quebra o build.
env:
  IMAGE_OWNER: gabriel-rodrigues-s

jobs:
  # ── Video Downloader (código na raiz) ──────────────────────────────────────
  video-downloader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push — video-downloader
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/yt-downloader:latest
          cache-from: type=gha,scope=video-downloader
          cache-to: type=gha,scope=video-downloader,mode=max

  # ── Real Assessoria (código em realassessoria/) ───────────────────────────
