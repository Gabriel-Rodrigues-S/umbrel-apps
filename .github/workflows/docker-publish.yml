name: Publicar imagens Docker

# Reconstrói e publica no GHCR apenas os apps cujo código mudou no push.
#  - :latest é sempre atualizado.
#  - :<versão do umbrel-app.yml> só é criado se ainda não existir: tags de versão
#    nunca são sobrescritas (o compose de cada app aponta para uma delas).
#  - Mudanças só em manifests (garod004-apps-*/), README ou neste workflow não
#    geram build. Para forçar: Actions > Publicar imagens Docker > Run workflow
#    (apps: "todos" ou uma lista, ex.: file-converter,tts-reader).
# O mapeamento app -> pasta -> imagem fica em .github/scripts/detectar-apps.py.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps a publicar: 'todos' ou lista separada por vírgula"
        required: false
        default: todos

# O ghcr.io exige o nome do repositório em minúsculas; github.repository_owner
# vem com a capitalização da conta (Gabriel-Rodrigues-S) e quebra o build.
env:
  IMAGE_OWNER: gabriel-rodrigues-s

# Um publicador por vez, para duas execuções não disputarem as mesmas tags.
concurrency:
  group: publicar-imagens
  cancel-in-progress: false

jobs:
  detectar:
    name: Detectar apps alterados
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matriz: ${{ steps.calc.outputs.matriz }}
      tem: ${{ steps.calc.outputs.tem }}
    steps:
      - name: Checkout (histórico completo, para comparar commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escolher apps
        id: calc
        env:
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_APPS: ${{ inputs.apps }}
        run: python3 .github/scripts/detectar-apps.py

  publicar:
    name: Build e push — ${{ matrix.app }}
    needs: detectar
    if: needs.detectar.outputs.tem == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detectar.outputs.matriz) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tags (a de versão nunca é sobrescrita)
        id: tags
        env:
          IMG: ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          VERSAO: ${{ matrix.version }}
        run: |
          tags="$IMG:latest"
          if docker buildx imagetools inspect "$IMG:$VERSAO" >/dev/null 2>&1; then
            echo "A tag $IMG:$VERSAO já existe e será mantida; só a :latest é atualizada."
          else
            tags="$tags"$'\n'"$IMG:$VERSAO"
            echo "Será criada também a tag $IMG:$VERSAO."
          fi
          {
            echo 'lista<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build e push — ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.lista }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
