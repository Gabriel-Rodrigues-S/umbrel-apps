manifestVersion: 1
id: garod004-apps-painel-mercado
name: Painel Mercado
tagline: Agregador de notícias e cotações do mercado financeiro
icon: https://raw.githubusercontent.com/Gabriel-Rodrigues-S/umbrel-apps/main/garod004-apps-painel-mercado/icon.svg
category: finance
version: '1.0.2'
port: 8420
description: >-
  Painel que reúne, em um só lugar, notícias reais de mercado financeiro (InfoMoney,
  Investing.com, Cointelegraph Brasil, CNBC e TradingView Brasil) e cotações ao vivo
  de Ibovespa, S&P 500, Nasdaq, dólar, euro, Bitcoin, Ethereum, petróleo, ouro e Selic,
  via Yahoo Finance e Banco Central do Brasil. Notícias são filtráveis por categoria
  (Ações & B3, Câmbio, Juros & BC, Cripto, Commodities, Mercados globais) e as
  cotações são atualizadas automaticamente em segundo plano.
