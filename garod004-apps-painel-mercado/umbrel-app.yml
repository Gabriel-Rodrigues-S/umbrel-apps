releaseNotes: >-
  v1.0.2: imagem fixada na tag 1.0.1 (o mesmo build que já está instalado); mudanças na :latest não afetam mais este app. Sem mudanças de funcionamento.
  v1.0.1: imagem do app migrada para o novo registro (ghcr.io/gabriel-rodrigues-s); sem mudanças de funcionamento.
  Primeira versão. Agregação de notícias via RSS e cotações via Yahoo Finance/BCB,
  com filtros por categoria e cache em disco para manter os últimos dados bons
  caso alguma fonte fique indisponível.
