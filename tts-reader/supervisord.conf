[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; ── Piper TTS backend (FastAPI + uvicorn) ─────────────────────────────────
[program:backend]
command=/usr/local/bin/uvicorn backend:app --host 127.0.0.1 --port 5000 --workers 1
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── nginx (serves HTML + proxies /synthesize) ────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
