<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTS Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d2e;
      --surface2:  #242740;
      --accent:    #5b6af0;
      --accent2:   #7c8bf5;
      --highlight: rgba(91, 106, 240, 0.22);
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --border:    #2d3148;
      --green:     #22c55e;
      --yellow:    #f59e0b;
      --red:       #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }

    header h1 { font-size: 1.15rem; font-weight: 700; }

    .wave-container {
      margin-left: auto;
      display: flex; align-items: center; gap: 3px; height: 22px;
    }

    .wave-bar {
      width: 3px; background: var(--accent2);
      border-radius: 2px; height: 5px;
    }

    .wave-bar.playing {
      animation: wave var(--dur, 0.7s) ease-in-out infinite alternate;
    }

    @keyframes wave { from { height: 3px; } to { height: 20px; } }

    /* ── Main ────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 1rem 1.1rem 2rem;
      display: flex; flex-direction: column; gap: 0.9rem;
      max-width: 860px; width: 100%; margin: 0 auto;
    }

    /* ── Cards ───────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.1rem 1rem;
    }

    .card-label {
      font-size: 0.7rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 0.7rem;
    }

    /* ── Text input ──────────────────────────────────── */
    .input-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem; gap: 0.5rem;
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit; font-size: 0.88rem; line-height: 1.65;
      padding: 0.7rem 0.85rem; resize: vertical; min-height: 110px;
      outline: none; transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.45rem 0.9rem;
      border-radius: 7px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
    }

    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-icon {
      width: 42px; height: 42px; padding: 0;
      justify-content: center; border-radius: 9px;
      font-size: 1.05rem; background: var(--surface2);
    }

    .btn-play {
      width: 50px; height: 50px; border-radius: 12px;
      font-size: 1.25rem;
      background: var(--accent); border-color: var(--accent); color: #fff;
    }

    .btn-play:hover:not(:disabled) {
      background: var(--accent2); border-color: var(--accent2); color: #fff;
    }

    .btn-loop.active {
      border-color: var(--accent); color: var(--accent); background: var(--highlight);
    }

    /* ── Player row ──────────────────────────────────── */
    .player-row {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    }

    .spacer { flex: 1; }

    /* ── Engine badge ────────────────────────────────── */
    .engine-badge {
      font-size: 0.7rem; font-weight: 700;
      padding: 0.2rem 0.65rem; border-radius: 20px;
      border: 1px solid var(--border); color: var(--muted);
      background: transparent; transition: all 0.3s; white-space: nowrap;
    }

    /* ── Settings ────────────────────────────────────── */
    .settings-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem;
    }

    @media (max-width: 480px) { .settings-grid { grid-template-columns: 1fr; } }

    .field-label {
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 0.35rem; display: block;
    }

    select {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.85rem;
      padding: 0.48rem 0.75rem; outline: none; cursor: pointer;
      transition: border-color 0.15s;
    }

    select:focus { border-color: var(--accent); }

    .speed-row {
      display: flex; align-items: center; gap: 0.65rem; margin-top: 0.35rem;
    }

    input[type="range"] {
      flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px;
    }

    .speed-val {
      font-size: 0.85rem; font-weight: 700;
      color: var(--accent); min-width: 2.8rem; text-align: right;
    }

    /* ── Progress ────────────────────────────────────── */
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--muted); margin-bottom: 0.45rem;
    }

    .progress-track {
      height: 5px; background: var(--surface2);
      border-radius: 3px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; background: var(--accent);
      border-radius: 3px; width: 0%; transition: width 0.35s ease;
    }

    .status-bar {
      margin-top: 0.6rem; font-size: 0.8rem;
      color: var(--muted); min-height: 1.1em;
    }

    /* ── Text display ────────────────────────────────── */
    .text-display {
      display: none; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.85rem 1rem; max-height: 260px; overflow-y: auto;
      font-size: 0.88rem; line-height: 1.75; margin-top: 0.8rem;
    }

    .text-display.visible { display: block; }

    .s-span {
      border-radius: 3px; padding: 1px 2px;
      transition: background 0.2s, color 0.15s;
    }

    .s-span.active {
      background: var(--highlight); color: var(--accent2); font-weight: 500;
    }

    /* ── Hint ────────────────────────────────────────── */
    .hint {
      font-size: 0.72rem; color: var(--muted);
      opacity: 0.7; text-align: center; padding-bottom: 0.25rem;
    }

    kbd {
      display: inline-block; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 0 4px; font-family: inherit; font-size: 0.7rem;
    }

    /* ── Scrollbar ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    #fileInput { display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">🔊</div>
  <h1>TTS Reader</h1>
  <div class="wave-container" id="waveContainer">
    <div class="wave-bar" style="--dur:0.65s"></div>
    <div class="wave-bar" style="--dur:0.45s"></div>
    <div class="wave-bar" style="--dur:0.85s"></div>
    <div class="wave-bar" style="--dur:0.55s"></div>
    <div class="wave-bar" style="--dur:0.75s"></div>
  </div>
</header>

<main>

  <!-- ── Texto ──────────────────────────────────────── -->
  <div class="card">
    <div class="input-header">
      <span class="card-label">Texto</span>
      <label class="btn" for="fileInput" title="Aceita .txt, .md e .docx">
        📂 Carregar arquivo
      </label>
      <input type="file" id="fileInput" accept=".txt,.md,.docx" />
    </div>
    <textarea id="textArea"
      placeholder="Cole seu texto aqui, ou carregue um arquivo .txt, .md ou .docx…"
      rows="6"
    ></textarea>
  </div>

  <!-- ── Reprodutor ─────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Reprodutor</div>
    <div class="player-row">
      <button class="btn btn-icon" id="btnPrev" title="Frase anterior  ←" disabled>⏮</button>
      <button class="btn btn-icon btn-play" id="btnPlay" title="Play / Pause  Espaço" disabled>▶</button>
      <button class="btn btn-icon" id="btnStop" title="Parar  Esc" disabled>⏹</button>
      <button class="btn btn-icon" id="btnNext" title="Próxima frase  →" disabled>⏭</button>
      <div class="spacer"></div>
      <span class="engine-badge" id="engineBadge">Carregando…</span>
      <button class="btn btn-icon btn-loop" id="btnLoop" title="Loop  L">🔁</button>
    </div>
  </div>

  <!-- ── Configurações ──────────────────────────────── -->
  <div class="card">
    <div class="card-label">Configurações de voz</div>
    <div class="settings-grid">
      <div>
        <label class="field-label" for="voiceSelect">Voz</label>
        <select id="voiceSelect"><option value="">Carregando…</option></select>
      </div>
      <div>
        <label class="field-label" for="speedRange">Velocidade</label>
        <div class="speed-row">
          <input type="range" id="speedRange" min="0.5" max="2.5" step="0.1" value="1.0" />
          <span class="speed-val" id="speedVal">1.0×</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Progresso ──────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Progresso</div>
    <div class="progress-meta">
      <span id="counterLabel">— frases</span>
      <span id="pctLabel">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-bar" id="statusBar">Inicializando…</div>
    <div class="text-display" id="textDisplay"></div>
  </div>

  <p class="hint">
    <kbd>Espaço</kbd> Play/Pause &nbsp;·&nbsp;
    <kbd>Esc</kbd> Stop &nbsp;·&nbsp;
    <kbd>←</kbd><kbd>→</kbd> Navegar &nbsp;·&nbsp;
    <kbd>L</kbd> Loop
  </p>

</main>

<script>
// ═══════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════
const st = {
  sentences: [],
  idx:       0,
  playing:   false,
  loopOn:    false,
  snapshot:  '',
};

let abortCtrl    = null;   // AbortController for current fetch/speech
let currentAudio = null;   // HTML Audio element (Piper mode)
let piperReady   = false;  // Piper backend available
let sortedVoices = [];     // Web Speech API voices

// ═══════════════════════════════════════════════════════════════════════
// DOM refs
// ═══════════════════════════════════════════════════════════════════════
const $       = id => document.getElementById(id);
const ta      = $('textArea');
const fi      = $('fileInput');
const bPlay   = $('btnPlay');
const bStop   = $('btnStop');
const bPrev   = $('btnPrev');
const bNext   = $('btnNext');
const bLoop   = $('btnLoop');
const vSel    = $('voiceSelect');
const sRange  = $('speedRange');
const sVal    = $('speedVal');
const cLabel  = $('counterLabel');
const pLabel  = $('pctLabel');
const pFill   = $('progressFill');
const status  = $('statusBar');
const tDisp   = $('textDisplay');
const badge   = $('engineBadge');
const wBars   = document.querySelectorAll('.wave-bar');

// ═══════════════════════════════════════════════════════════════════════
// Environment detection
// ═══════════════════════════════════════════════════════════════════════
const isElectron = /Electron\//.test(navigator.userAgent);

// ═══════════════════════════════════════════════════════════════════════
// Engine initialisation
// ═══════════════════════════════════════════════════════════════════════
async function initEngines() {
  say('Verificando motores de voz…');

  // 1 ── Piper backend check (with retries — backend may take a few
  //      seconds to load the ONNX model on first container start)
  if (!isElectron) {
    for (let i = 0; i < 6; i++) {
      try {
        const r = await fetch('/health', { signal: AbortSignal.timeout(2500) });
        if (r.ok) {
          const d = await r.json();
          piperReady = !!d.ready;
          break;
        }
      } catch { /* backend not up yet */ }
      if (i < 5) await sleep(2000);
    }
  }

  // 2 ── Web Speech API voices (event + polling + 5 s timeout)
  if ('speechSynthesis' in window && !isElectron) {
    await new Promise(resolve => {
      const done = () => { buildWSVoices(); resolve(); };
      if (speechSynthesis.getVoices().length) { done(); return; }
      speechSynthesis.addEventListener('voiceschanged', done, { once: true });
      let tries = 0;
      const poll = setInterval(() => {
        if (speechSynthesis.getVoices().length || ++tries > 25) {
          clearInterval(poll); done();
        }
      }, 200);
      setTimeout(() => { clearInterval(poll); resolve(); }, 5000);
    });
  }

  // 3 ── Build voice selector
  populateVoiceSelect();
  updateBadge();

  // 4 ── Status message
  if (isElectron) {
    say('⚠️ Preview (Electron): voz não disponível. Abra no Chrome ou Firefox.', '#f59e0b');
  } else if (piperReady) {
    say('🧠 Piper Neural pronto. Cole um texto ou carregue um arquivo.', '#22c55e');
  } else {
    say('Cole um texto ou carregue um arquivo para começar.');
  }
}

function buildWSVoices() {
  const all = speechSynthesis.getVoices();
  const pt  = all.filter(v => v.lang.startsWith('pt'));
  sortedVoices = [...pt, ...all.filter(v => !v.lang.startsWith('pt'))];
}

function populateVoiceSelect() {
  vSel.innerHTML = '';

  // Piper option (neural — primary when available)
  if (piperReady) {
    const o = document.createElement('option');
    o.value = 'piper';
    o.textContent = '🧠 Piper Neural — faber (pt-BR)';
    vSel.appendChild(o);
  }

  // Web Speech voices
  sortedVoices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = `ws_${i}`;
    o.textContent = `🔊 ${v.name} (${v.lang})`;
    vSel.appendChild(o);
  });

  // Ultimate fallback
  if (!vSel.options.length) {
    const o = document.createElement('option');
    o.value = 'default';
    o.textContent = '— Padrão do sistema —';
    vSel.appendChild(o);
  }
}

function updateBadge() {
  if (isElectron) {
    setBadge('⚠️ Preview', '#f59e0b', 'rgba(245,158,11,.12)', '#92400e');
    return;
  }
  const mode = vSel.value;
  if (mode === 'piper') {
    setBadge('🧠 Neural', '#22c55e', 'rgba(34,197,94,.12)', '#166534');
  } else {
    setBadge('🔊 Web Speech', 'var(--accent2)', 'rgba(91,106,240,.12)', 'var(--border)');
  }
}

function setBadge(txt, color, bg, border) {
  badge.textContent       = txt;
  badge.style.color       = color;
  badge.style.background  = bg;
  badge.style.borderColor = border;
}

vSel.addEventListener('change', updateBadge);

// ═══════════════════════════════════════════════════════════════════════
// Sentence splitting (no lookbehind — Safari compat)
// ═══════════════════════════════════════════════════════════════════════
function toSentences(text) {
  const out = [];
  for (const para of text.split(/\n\s*\n+/)) {
    const t = para.trim().replace(/\n/g, ' ');
    if (!t) continue;
    const parts = t.replace(/([.!?…;]+)\s+/g, '$1\x00').split('\x00');
    for (const p of parts) { const s = p.trim(); if (s) out.push(s); }
  }
  return out.length ? out : (text.trim() ? [text.trim()] : []);
}

// ═══════════════════════════════════════════════════════════════════════
// Display helpers
// ═══════════════════════════════════════════════════════════════════════
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildDisplay() {
  if (!st.sentences.length) { tDisp.classList.remove('visible'); return; }
  tDisp.innerHTML = st.sentences
    .map((s, i) => `<span class="s-span" data-i="${i}">${esc(s)}</span>`)
    .join(' ');
  tDisp.classList.add('visible');
}

function highlight() {
  tDisp.querySelectorAll('.s-span').forEach((el, i) =>
    el.classList.toggle('active', i === st.idx));
  const a = tDisp.querySelector('.s-span.active');
  if (a) a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ═══════════════════════════════════════════════════════════════════════
// UI sync
// ═══════════════════════════════════════════════════════════════════════
function syncUI() {
  const total = st.sentences.length;
  const pos   = Math.min(st.idx, total);
  const pct   = total ? Math.round((pos / total) * 100) : 0;

  cLabel.textContent = total ? `${pos} / ${total} frases` : '— frases';
  pLabel.textContent = `${pct}%`;
  pFill.style.width  = `${pct}%`;
  bPlay.textContent  = st.playing ? '⏸' : '▶';
  bPlay.disabled = bStop.disabled = bPrev.disabled = bNext.disabled = !total;
  bLoop.classList.toggle('active', st.loopOn);
  wBars.forEach(b => b.classList.toggle('playing', st.playing));
}

function say(msg, color) {
  status.textContent   = msg;
  status.style.color   = color || '';
}

// ═══════════════════════════════════════════════════════════════════════
// Text loading
// ═══════════════════════════════════════════════════════════════════════
function loadText(raw) {
  const text = raw.trim();
  cancelCurrent();
  st.playing  = false; st.idx = 0; st.snapshot = text;
  st.sentences = text ? toSentences(text) : [];
  buildDisplay(); syncUI();
  say(st.sentences.length
    ? `${st.sentences.length} frases carregadas. Pressione ▶ para ouvir.`
    : 'Cole um texto ou carregue um arquivo para começar.');
}

ta.addEventListener('input', () => { if (!st.playing) loadText(ta.value); });

fi.addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  fi.value = ''; say('Carregando arquivo…');
  try {
    let text = '';
    if (file.name.toLowerCase().endsWith('.docx')) {
      const res = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      text = res.value;
    } else {
      text = await file.text();
    }
    ta.value = text; loadText(text);
    say(`"${file.name}" carregado — ${st.sentences.length} frases.`);
  } catch (err) { say(`Erro ao carregar: ${err.message}`, '#ef4444'); }
});

// ═══════════════════════════════════════════════════════════════════════
// Playback — core
// ═══════════════════════════════════════════════════════════════════════
function cancelCurrent() {
  if (abortCtrl)    { abortCtrl.abort(); abortCtrl = null; }
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// ── Piper ──────────────────────────────────────────────────────────────
async function speakPiper(text, signal) {
  const r = await fetch('/synthesize', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, speed: parseFloat(sRange.value) }),
    signal,
  });
  if (!r.ok) throw new Error(`piper HTTP ${r.status}`);

  const url = URL.createObjectURL(await r.blob());
  return new Promise((resolve, reject) => {
    currentAudio = new Audio(url);
    const cleanup = () => { URL.revokeObjectURL(url); currentAudio = null; };
    currentAudio.onended = () => { cleanup(); resolve(); };
    currentAudio.onerror = () => { cleanup(); reject(new Error('audio-error')); };
    signal.addEventListener('abort', () => {
      currentAudio?.pause(); cleanup();
      reject(Object.assign(new Error('Aborted'), { name: 'AbortError' }));
    });
    currentAudio.play().catch(reject);
  });
}

// ── Web Speech API ─────────────────────────────────────────────────────
async function speakWebSpeech(text, signal) {
  if (!('speechSynthesis' in window)) throw new Error('Web Speech não disponível');
  return new Promise((resolve, reject) => {
    const utt = new SpeechSynthesisUtterance(text);
    const val = vSel.value;
    if (val.startsWith('ws_')) {
      const i = parseInt(val.slice(3));
      utt.voice = sortedVoices[i] || null;
    }
    utt.rate = parseFloat(sRange.value);
    utt.lang = utt.voice?.lang || 'pt-BR';
    utt.onend = resolve;
    utt.onerror = ev => {
      if (ev.error === 'interrupted' || ev.error === 'canceled') { resolve(); return; }
      reject(new Error(ev.error));
    };
    signal.addEventListener('abort', () => { speechSynthesis.cancel(); resolve(); });
    speechSynthesis.speak(utt);
  });
}

// ── Dispatch to correct engine ─────────────────────────────────────────
async function speakOne(text, signal) {
  if (vSel.value === 'piper') return speakPiper(text, signal);
  return speakWebSpeech(text, signal);
}

// ── Async play loop ────────────────────────────────────────────────────
async function runLoop() {
  while (st.playing) {
    if (st.idx >= st.sentences.length) {
      if (st.loopOn) { st.idx = 0; } else { break; }
    }
    syncUI();
    highlight();

    const isPiper = vSel.value === 'piper';
    say(isPiper
      ? `🧠 Gerando… frase ${st.idx + 1} / ${st.sentences.length}`
      : `Lendo frase ${st.idx + 1} de ${st.sentences.length}…`);

    abortCtrl = new AbortController();
    try {
      await speakOne(st.sentences[st.idx], abortCtrl.signal);
      st.idx++;
    } catch (err) {
      if (err?.name === 'AbortError') break;
      if (isElectron) {
        say('⚠️ Síntese não disponível no preview. Use Chrome ou Firefox.', '#f59e0b');
        break;
      }
      // Non-fatal: log and skip sentence
      console.warn(`[TTS] sentence ${st.idx} error:`, err?.message);
      say(`Erro na frase ${st.idx + 1} — pulando.`, '#f59e0b');
      st.idx++;
    }
  }

  st.playing = false;
  abortCtrl  = null;
  syncUI();
  if (st.idx >= st.sentences.length && !st.loopOn) {
    say('✅ Leitura concluída.', '#22c55e');
  }
}

// ═══════════════════════════════════════════════════════════════════════
// Player controls
// ═══════════════════════════════════════════════════════════════════════
function play() {
  if (!st.sentences.length) return;
  if (ta.value.trim() !== st.snapshot) loadText(ta.value);
  if (!st.sentences.length) return;
  st.playing = true;
  syncUI();
  runLoop();
}

function pause() {
  st.playing = false;
  cancelCurrent();
  syncUI();
  say(`Pausado na frase ${st.idx + 1}.`);
}

function stop() {
  st.playing = false;
  cancelCurrent();
  st.idx = 0;
  syncUI();
  highlight();
  say('Parado. Pressione ▶ para recomeçar do início.');
}

function go(delta) {
  const was = st.playing;
  st.playing = false;
  cancelCurrent();
  st.idx = Math.max(0, Math.min(st.sentences.length - 1, st.idx + delta));
  if (was) play();
  else { highlight(); syncUI(); say(`Frase ${st.idx + 1} de ${st.sentences.length}.`); }
}

// ═══════════════════════════════════════════════════════════════════════
// Event listeners
// ═══════════════════════════════════════════════════════════════════════
bPlay.addEventListener('click', () => st.playing ? pause() : play());
bStop.addEventListener('click', stop);
bPrev.addEventListener('click', () => go(-1));
bNext.addEventListener('click', () => go(+1));

bLoop.addEventListener('click', () => {
  st.loopOn = !st.loopOn; syncUI();
  say(st.loopOn ? 'Loop ativado.' : 'Loop desativado.');
});

sRange.addEventListener('input', () => {
  sVal.textContent = parseFloat(sRange.value).toFixed(1) + '×';
});

document.addEventListener('keydown', e => {
  if (e.target === ta) return;
  switch (e.key) {
    case ' ':          e.preventDefault(); if (!bPlay.disabled) bPlay.click(); break;
    case 'Escape':     if (!bStop.disabled) stop(); break;
    case 'ArrowRight': e.preventDefault(); if (!bNext.disabled) go(+1); break;
    case 'ArrowLeft':  e.preventDefault(); if (!bPrev.disabled) go(-1); break;
    case 'l': case 'L': bLoop.click(); break;
  }
});

// ═══════════════════════════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════════════════════════
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ═══════════════════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════════════════
syncUI();
initEngines();
</script>
</body>
</html>
