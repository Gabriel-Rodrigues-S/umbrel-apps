<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTS Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d2e;
      --surface2:  #242740;
      --accent:    #5b6af0;
      --accent2:   #7c8bf5;
      --highlight: rgba(91, 106, 240, 0.22);
      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --border:    #2d3148;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.15rem; font-weight: 700; }

    .wave-container {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
    }

    .wave-bar {
      width: 3px;
      background: var(--accent2);
      border-radius: 2px;
      height: 5px;
    }

    .wave-bar.playing {
      animation: wave var(--dur, 0.7s) ease-in-out infinite alternate;
    }

    @keyframes wave {
      from { height: 3px; }
      to   { height: 20px; }
    }

    /* ── Main layout ─────────────────────────────────── */
    main {
      flex: 1;
      padding: 1rem 1.1rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Card ────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.1rem 1rem;
    }

    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.7rem;
    }

    /* ── Text input ──────────────────────────────────── */
    .input-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      line-height: 1.65;
      padding: 0.7rem 0.85rem;
      resize: vertical;
      min-height: 110px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.9rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s, opacity 0.15s;
    }

    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-icon {
      width: 42px; height: 42px;
      padding: 0;
      justify-content: center;
      border-radius: 9px;
      font-size: 1.05rem;
      background: var(--surface2);
    }

    .btn-play {
      width: 50px; height: 50px;
      border-radius: 12px;
      font-size: 1.25rem;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-play:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); color: #fff; }

    .btn-loop.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--highlight);
    }

    /* ── Player controls ─────────────────────────────── */
    .player-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .spacer { flex: 1; }

    /* ── Settings ────────────────────────────────────── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    @media (max-width: 480px) { .settings-grid { grid-template-columns: 1fr; } }

    .field-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      display: block;
    }

    select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.48rem 0.75rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    select:focus { border-color: var(--accent); }

    .speed-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 0.35rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    .speed-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 2.8rem;
      text-align: right;
    }

    /* ── Progress ────────────────────────────────────── */
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .progress-track {
      height: 5px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.35s ease;
    }

    .status-bar {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.1em;
    }

    /* ── Highlighted text display ────────────────────── */
    .text-display {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      max-height: 260px;
      overflow-y: auto;
      font-size: 0.88rem;
      line-height: 1.75;
      margin-top: 0.8rem;
    }

    .text-display.visible { display: block; }

    .s-span {
      border-radius: 3px;
      padding: 1px 2px;
      transition: background 0.2s, color 0.15s;
    }

    .s-span.active {
      background: var(--highlight);
      color: var(--accent2);
      font-weight: 500;
    }

    /* ── Scrollbar ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ── Keyboard hint ───────────────────────────────── */
    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.7;
      text-align: center;
      padding-bottom: 0.25rem;
    }

    kbd {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 4px;
      font-family: inherit;
      font-size: 0.7rem;
    }

    /* hidden file input */
    #fileInput { display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">🔊</div>
  <h1>TTS Reader</h1>
  <div class="wave-container" id="waveContainer">
    <div class="wave-bar" style="--dur:0.65s"></div>
    <div class="wave-bar" style="--dur:0.45s"></div>
    <div class="wave-bar" style="--dur:0.85s"></div>
    <div class="wave-bar" style="--dur:0.55s"></div>
    <div class="wave-bar" style="--dur:0.75s"></div>
  </div>
</header>

<main>

  <!-- ── Text Input ─────────────────────────────────── -->
  <div class="card">
    <div class="input-header">
      <span class="card-label">Texto</span>
      <label class="btn" for="fileInput" title="Aceita .txt, .md e .docx">
        📂 Carregar arquivo
      </label>
      <input type="file" id="fileInput" accept=".txt,.md,.docx" />
    </div>
    <textarea id="textArea"
      placeholder="Cole seu texto aqui, ou carregue um arquivo .txt, .md ou .docx…"
      rows="6"
    ></textarea>
  </div>

  <!-- ── Player ─────────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Reprodutor</div>
    <div class="player-row">
      <button class="btn btn-icon" id="btnPrev" title="Frase anterior  ←" disabled>⏮</button>
      <button class="btn btn-icon btn-play" id="btnPlay" title="Play / Pause  Espaço" disabled>▶</button>
      <button class="btn btn-icon" id="btnStop" title="Parar  Esc" disabled>⏹</button>
      <button class="btn btn-icon" id="btnNext" title="Próxima frase  →" disabled>⏭</button>
      <div class="spacer"></div>
      <button class="btn btn-icon btn-loop" id="btnLoop" title="Loop  L">🔁</button>
    </div>
  </div>

  <!-- ── Settings ───────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Configurações de voz</div>
    <div class="settings-grid">
      <div>
        <label class="field-label" for="voiceSelect">Voz</label>
        <select id="voiceSelect"><option value="">Carregando vozes…</option></select>
      </div>
      <div>
        <label class="field-label" for="speedRange">Velocidade</label>
        <div class="speed-row">
          <input type="range" id="speedRange" min="0.5" max="2.5" step="0.1" value="1.0" />
          <span class="speed-val" id="speedVal">1.0×</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Progress ───────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Progresso</div>
    <div class="progress-meta">
      <span id="counterLabel">— frases</span>
      <span id="pctLabel">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-bar" id="statusBar">Cole um texto ou carregue um arquivo para começar.</div>
    <div class="text-display" id="textDisplay"></div>
  </div>

  <p class="hint">
    <kbd>Espaço</kbd> Play/Pause &nbsp;·&nbsp;
    <kbd>Esc</kbd> Stop &nbsp;·&nbsp;
    <kbd>←</kbd><kbd>→</kbd> Navegar frases &nbsp;·&nbsp;
    <kbd>L</kbd> Loop
  </p>

</main>

<script>
// ── State ───────────────────────────────────────────────────────────────────
const st = {
  sentences: [],
  idx:       0,
  playing:   false,
  loopOn:    false,
  snapshot:  '',
};

// ── DOM ─────────────────────────────────────────────────────────────────────
const $      = id => document.getElementById(id);
const ta     = $('textArea');
const fi     = $('fileInput');
const bPlay  = $('btnPlay');
const bStop  = $('btnStop');
const bPrev  = $('btnPrev');
const bNext  = $('btnNext');
const bLoop  = $('btnLoop');
const vSel   = $('voiceSelect');
const sRange = $('speedRange');
const sVal   = $('speedVal');
const cLabel = $('counterLabel');
const pLabel = $('pctLabel');
const pFill  = $('progressFill');
const status = $('statusBar');
const tDisp  = $('textDisplay');
const wBars  = document.querySelectorAll('.wave-bar');

// ── Speech API availability check ────────────────────────────────────────────
if (!('speechSynthesis' in window)) {
  document.querySelector('main').innerHTML =
    '<div class="card" style="color:#ef4444;text-align:center;padding:2rem">' +
    '⚠️ Este navegador não suporta Web Speech API.<br>' +
    'Use Chrome, Edge ou Safari para utilizar o TTS Reader.</div>';
  throw new Error('speechSynthesis not available');
}

// Warn if running inside Electron (Claude Code preview, etc.) where TTS doesn't work
const _isElectron = /Electron\//.test(navigator.userAgent);
if (_isElectron) {
  document.getElementById('statusBar').textContent =
    '⚠️ Preview interno detectado (Electron). A síntese de voz não funciona aqui. ' +
    'Abra o app no Chrome, Firefox ou Safari para ouvir o texto.';
  document.getElementById('statusBar').style.color = '#f59e0b';
}

// ── Voices ──────────────────────────────────────────────────────────────────
let sortedVoices = [];
let voicePoller  = null;

function populateVoiceSelect(all) {
  const pt     = all.filter(v => v.lang.startsWith('pt'));
  const others = all.filter(v => !v.lang.startsWith('pt'));
  sortedVoices = [...pt, ...others];

  const prev = vSel.value;
  vSel.innerHTML = '';

  // Always offer a "system default" option first
  const defOpt = document.createElement('option');
  defOpt.value = -1;
  defOpt.textContent = '— Padrão do sistema —';
  vSel.appendChild(defOpt);

  sortedVoices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    vSel.appendChild(o);
  });

  // Restore previous selection or pick first pt-BR/pt-PT voice
  if (prev !== '' && vSel.querySelector(`option[value="${prev}"]`)) {
    vSel.value = prev;
  } else {
    const ptIdx = sortedVoices.findIndex(v => v.lang.startsWith('pt'));
    vSel.value = ptIdx >= 0 ? ptIdx : -1;
  }
}

function tryLoadVoices() {
  const all = speechSynthesis.getVoices();
  if (!all.length) return false;
  populateVoiceSelect(all);
  if (voicePoller) { clearInterval(voicePoller); voicePoller = null; }
  return true;
}

function showDefaultVoiceFallback() {
  vSel.innerHTML = '<option value="-1">— Padrão do sistema —</option>';
}

if (_isElectron) {
  // Electron never has TTS voices — skip polling and show fallback immediately
  showDefaultVoiceFallback();
} else {
  // Strategy: event + polling + 5s fallback
  speechSynthesis.addEventListener('voiceschanged', tryLoadVoices);
  if (!tryLoadVoices()) {
    // Poll every 200 ms — handles Firefox and slow Chrome init
    voicePoller = setInterval(tryLoadVoices, 200);
    // After 5 s, give up and show system default fallback
    setTimeout(() => {
      if (voicePoller) { clearInterval(voicePoller); voicePoller = null; }
      if (!sortedVoices.length) showDefaultVoiceFallback();
    }, 5000);
  }
}

function currentVoice() {
  const idx = parseInt(vSel.value, 10);
  return (idx >= 0 && sortedVoices[idx]) ? sortedVoices[idx] : null;
}

// ── Sentence splitting (no lookbehind — compatible with all browsers) ────────
function toSentences(text) {
  const out = [];
  const paras = text.split(/\n\s*\n+/);
  for (const para of paras) {
    const t = para.trim().replace(/\n/g, ' ');
    if (!t) continue;
    // Replace sentence terminators + space with a null-char delimiter, then split
    const parts = t.replace(/([.!?…;]+)\s+/g, '$1\x00').split('\x00');
    for (const p of parts) {
      const s = p.trim();
      if (s) out.push(s);
    }
  }
  return out.length ? out : (text.trim() ? [text.trim()] : []);
}

// ── Text display ─────────────────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildDisplay() {
  if (!st.sentences.length) { tDisp.classList.remove('visible'); return; }
  tDisp.innerHTML = st.sentences
    .map((s, i) => `<span class="s-span" data-i="${i}">${esc(s)}</span>`)
    .join(' ');
  tDisp.classList.add('visible');
}

function highlight() {
  tDisp.querySelectorAll('.s-span').forEach((el, i) => {
    el.classList.toggle('active', i === st.idx);
  });
  const active = tDisp.querySelector('.s-span.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ── Progress & controls UI ───────────────────────────────────────────────────
function syncUI() {
  const total = st.sentences.length;
  const pos   = Math.min(st.idx, total);
  const pct   = total ? Math.round((pos / total) * 100) : 0;

  cLabel.textContent = total ? `${pos} / ${total} frases` : '— frases';
  pLabel.textContent = `${pct}%`;
  pFill.style.width  = `${pct}%`;

  bPlay.textContent = st.playing ? '⏸' : '▶';
  bPlay.disabled    = !total;
  bStop.disabled    = !total;
  bPrev.disabled    = !total;
  bNext.disabled    = !total;
  bLoop.classList.toggle('active', st.loopOn);
  wBars.forEach(b => b.classList.toggle('playing', st.playing));
}

function say(msg) { status.textContent = msg; }

// ── Load text ────────────────────────────────────────────────────────────────
function loadText(raw) {
  const text = raw.trim();
  speechSynthesis.cancel();
  st.playing   = false;
  st.idx       = 0;
  st.snapshot  = text;
  st.sentences = text ? toSentences(text) : [];
  buildDisplay();
  syncUI();
  say(st.sentences.length
    ? `${st.sentences.length} frases carregadas. Pressione ▶ para ouvir.`
    : 'Cole um texto ou carregue um arquivo para começar.');
}

ta.addEventListener('input', () => {
  if (!st.playing) loadText(ta.value);
});

// ── File loader ──────────────────────────────────────────────────────────────
fi.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  fi.value = '';
  say('Carregando arquivo…');
  try {
    let text = '';
    if (file.name.toLowerCase().endsWith('.docx')) {
      const buf = await file.arrayBuffer();
      const res = await mammoth.extractRawText({ arrayBuffer: buf });
      text = res.value;
    } else {
      text = await file.text();
    }
    ta.value = text;
    loadText(text);
    say(`"${file.name}" carregado — ${st.sentences.length} frases.`);
  } catch (err) {
    say(`Erro ao carregar arquivo: ${err.message}`);
  }
});

// ── Playback engine ──────────────────────────────────────────────────────────
function speakAt(i) {
  if (i >= st.sentences.length) {
    if (st.loopOn) { st.idx = 0; speakAt(0); return; }
    st.playing = false;
    syncUI();
    say('Leitura concluída.');
    return;
  }

  st.idx = i;
  syncUI();
  highlight();

  const utt  = new SpeechSynthesisUtterance(st.sentences[i]);
  utt.voice  = currentVoice();   // null = browser default (always works)
  utt.rate   = parseFloat(sRange.value);
  utt.lang   = utt.voice ? utt.voice.lang : 'pt-BR';

  utt.onend = () => {
    if (st.playing) speakAt(i + 1);
  };

  utt.onerror = ev => {
    // Silently ignore cancel/interrupt (caused by pause/stop/navigate)
    if (ev.error === 'interrupted' || ev.error === 'canceled') return;

    // Fatal errors: speech engine unavailable — stop and warn user
    if (ev.error === 'synthesis-failed' || ev.error === 'synthesis-unavailable' ||
        ev.error === 'audio-busy' || ev.error === 'audio-hardware-unavailable') {
      st.playing = false;
      syncUI();
      const msg = _isElectron
        ? '⚠️ Síntese de voz não suportada neste preview. Abra o app no Chrome ou Firefox para ouvir.'
        : `Erro de síntese de voz (${ev.error}). Verifique se o áudio do navegador está ativo e tente outra voz.`;
      say(msg);
      return;
    }

    // Non-fatal errors (e.g. network): skip to next sentence
    if (st.playing) speakAt(i + 1);
  };

  speechSynthesis.speak(utt);
}

function play() {
  if (!st.sentences.length) return;
  if (ta.value.trim() !== st.snapshot) loadText(ta.value);
  if (!st.sentences.length) return;
  st.playing = true;
  syncUI();
  say(`Lendo frase ${st.idx + 1} de ${st.sentences.length}…`);
  speakAt(st.idx);
}

function pause() {
  speechSynthesis.cancel();
  st.playing = false;
  syncUI();
  say(`Pausado na frase ${st.idx + 1}.`);
}

function stop() {
  speechSynthesis.cancel();
  st.playing = false;
  st.idx     = 0;
  syncUI();
  highlight();
  say('Parado. Pressione ▶ para recomeçar do início.');
}

function go(delta) {
  const was = st.playing;
  speechSynthesis.cancel();
  st.playing = false;
  st.idx = Math.max(0, Math.min(st.sentences.length - 1, st.idx + delta));
  if (was) { st.playing = true; speakAt(st.idx); }
  else { highlight(); syncUI(); say(`Frase ${st.idx + 1} de ${st.sentences.length}.`); }
}

// ── Event listeners ──────────────────────────────────────────────────────────
bPlay.addEventListener('click', () => st.playing ? pause() : play());
bStop.addEventListener('click', stop);
bPrev.addEventListener('click', () => go(-1));
bNext.addEventListener('click', () => go(+1));

bLoop.addEventListener('click', () => {
  st.loopOn = !st.loopOn;
  syncUI();
  say(st.loopOn ? 'Loop ativado.' : 'Loop desativado.');
});

sRange.addEventListener('input', () => {
  sVal.textContent = parseFloat(sRange.value).toFixed(1) + '×';
});

document.addEventListener('keydown', e => {
  if (e.target === ta) return;
  switch (e.key) {
    case ' ':          e.preventDefault(); if (!bPlay.disabled) bPlay.click(); break;
    case 'Escape':     if (!bStop.disabled) stop(); break;
    case 'ArrowRight': e.preventDefault(); if (!bNext.disabled) go(+1); break;
    case 'ArrowLeft':  e.preventDefault(); if (!bPrev.disabled) go(-1); break;
    case 'l': case 'L': bLoop.click(); break;
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────
syncUI();
</script>
</body>
</html>
