gallery:
  - https://raw.githubusercontent.com/Gabriel-Rodrigues-S/umbrel-apps/main/garod004-apps-alertas/icon.svg
path: ''
defaultUsername: ''
defaultPassword: ''
releaseNotes: >-
  1.0.0: primeira versão, com API de alertas por remetente, retenção de 365 dias e push genérico.
