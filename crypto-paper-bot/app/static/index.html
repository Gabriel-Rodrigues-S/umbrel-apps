<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crypto Paper Bot</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #e6e8ec;
    --muted: #8b93a3; --green: #2ecc71; --red: #ff5c5c; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: var(--muted); }
  input, select { background: #10131a; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  button { background: var(--accent); color: white; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  button.secondary { background: #262b36; }
  button.danger { background: var(--red); }
  button:hover { opacity: 0.9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .bot-row { cursor: pointer; }
  .bot-row:hover { background: #1c202a; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .badge.running { background: #1e3a2a; color: var(--green); }
  .badge.paused { background: #3a3320; color: #e0c452; }
  #detail { display: none; }
  canvas { max-height: 260px; }
  .close-btn { float: right; cursor: pointer; color: var(--muted); }
  .warn { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .strategy-params { display: none; }
  .strategy-params.active { display: flex; }
  .regime-tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
  .regime-tag.trend { background: #1e2f47; color: #6fa8ff; }
  .regime-tag.range { background: #3a2f1e; color: #e0a952; }
  .adx-tag { font-size: 11px; color: var(--muted); }
  .adx-tag.active { color: var(--green); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Crypto Paper Bot</h1>
    <div class="sub">Simulação de trading — nenhuma ordem real é enviada</div>
  </div>
</header>
<main>
  <div class="card">
    <strong>Novo bot</strong>
    <div class="form-row" style="margin-top:10px">
      <div class="field">
        <label>Par</label>
        <input id="f-symbol" value="BTC/USDT" list="symbol-list" />
        <datalist id="symbol-list"></datalist>
      </div>
      <div class="field">
        <label>Timeframe</label>
        <select id="f-timeframe">
          <option>1m</option><option selected>5m</option><option>15m</option><option>1h</option><option>4h</option>
        </select>
      </div>
      <div class="field">
        <label>Estratégia</label>
        <select id="f-strategy" onchange="onStrategyChange()">
          <option value="sma_crossover">SMA Crossover</option>
          <option value="macd_crossover">MACD Crossover</option>
          <option value="rsi_reversion">RSI Reversão</option>
          <option value="bollinger_reversion">Bandas de Bollinger</option>
        </select>
      </div>
      <div class="field">
        <label>Saldo inicial (USDT)</label>
        <input id="f-balance" type="number" value="1000" style="width:110px" />
      </div>
      <button onclick="createBot()">Criar bot</button>
    </div>

    <div class="form-row strategy-params active" id="params-sma_crossover" style="margin-top:10px">
      <div class="field"><label>SMA rápida</label><input id="f-fast" type="number" value="9" style="width:70px" /></div>
      <div class="field"><label>SMA lenta</label><input id="f-slow" type="number" value="21" style="width:70px" /></div>
    </div>
    <div class="form-row strategy-params" id="params-macd_crossover" style="margin-top:10px">
      <div class="field"><label>EMA rápida</label><input id="f-macd-fast" type="number" value="12" style="width:70px" /></div>
      <div class="field"><label>EMA lenta</label><input id="f-macd-slow" type="number" value="26" style="width:70px" /></div>
      <div class="field"><label>Linha de sinal</label><input id="f-macd-signal" type="number" value="9" style="width:70px" /></div>
    </div>
    <div class="form-row strategy-params" id="params-rsi_reversion" style="margin-top:10px">
      <div class="field"><label>Período RSI</label><input id="f-rsi-period" type="number" value="14" style="width:70px" /></div>
      <div class="field"><label>Sobrevenda</label><input id="f-rsi-oversold" type="number" value="30" style="width:70px" /></div>
      <div class="field"><label>Sobrecompra</label><input id="f-rsi-overbought" type="number" value="70" style="width:70px" /></div>
    </div>
    <div class="form-row strategy-params" id="params-bollinger_reversion" style="margin-top:10px">
      <div class="field"><label>Período</label><input id="f-bb-period" type="number" value="20" style="width:70px" /></div>
      <div class="field"><label>Desvios padrão</label><input id="f-bb-std" type="number" value="2" step="0.1" style="width:70px" /></div>
    </div>
    <div class="form-row" style="margin-top:10px">
      <div class="field"><label>Período ADX</label><input id="f-adx-period" type="number" value="14" style="width:70px" /></div>
      <div class="field"><label>Limiar ADX</label><input id="f-adx-threshold" type="number" value="25" style="width:70px" /></div>
    </div>
    <div class="warn" id="strategy-hint"></div>
  </div>

  <div class="card">
    <strong>Bots ativos</strong>
    <table style="margin-top:10px">
      <thead><tr><th>Par</th><th>Estratégia</th><th>ADX</th><th>Status</th><th>Equity</th><th>P&L</th><th></th></tr></thead>
      <tbody id="bots-body"></tbody>
    </table>
  </div>

  <div class="card" id="detail">
    <span class="close-btn" onclick="closeDetail()">fechar ✕</span>
    <strong id="detail-title"></strong>
    <div class="sub" style="margin-bottom:6px">Preço da moeda — 🔺 compra 🔻 venda</div>
    <canvas id="price-chart"></canvas>
    <div class="sub" style="margin:14px 0 6px">Equity do bot (USDT)</div>
    <canvas id="equity-chart"></canvas>
    <table style="margin-top:14px">
      <thead><tr><th>Data</th><th>Lado</th><th>Preço</th><th>Qtd</th><th>PnL</th></tr></thead>
      <tbody id="trades-body"></tbody>
    </table>
  </div>
</main>

<script>
let chart = null;
let priceChart = null;
let strategies = [];

const TIMEFRAME_MS = { '1m': 60e3, '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3 };

function formatPrice(p) {
  if (p == null) return '—';
  if (p >= 1) return p.toFixed(2);
  return p.toPrecision(4);
}

async function loadStrategies() {
  try {
    strategies = await fetch('/api/strategies').then(r => r.json());
  } catch (e) {}
  onStrategyChange();
}

function onStrategyChange() {
  const selected = document.getElementById('f-strategy').value;
  document.querySelectorAll('.strategy-params').forEach(el => {
    el.classList.toggle('active', el.id === `params-${selected}`);
  });
  const info = strategies.find(s => s.id === selected);
  const hint = document.getElementById('strategy-hint');
  if (info) {
    hint.innerHTML = `${info.description} Regime: <b>${info.regime}</b> — o filtro de ADX só deixa esse bot operar quando o mercado estiver nesse regime.`;
  }
}

async function loadSymbols() {
  try {
    const list = await fetch('/api/symbols').then(r => r.json());
    document.getElementById('symbol-list').innerHTML = list.map(s => `<option value="${s}">`).join('');
  } catch (e) {}
}

async function createBot() {
  const payload = {
    symbol: document.getElementById('f-symbol').value.trim(),
    timeframe: document.getElementById('f-timeframe').value,
    strategy: document.getElementById('f-strategy').value,
    starting_balance: parseFloat(document.getElementById('f-balance').value),
    fast_period: parseInt(document.getElementById('f-fast').value),
    slow_period: parseInt(document.getElementById('f-slow').value),
    macd_fast: parseInt(document.getElementById('f-macd-fast').value),
    macd_slow: parseInt(document.getElementById('f-macd-slow').value),
    macd_signal: parseInt(document.getElementById('f-macd-signal').value),
    rsi_period: parseInt(document.getElementById('f-rsi-period').value),
    rsi_oversold: parseFloat(document.getElementById('f-rsi-oversold').value),
    rsi_overbought: parseFloat(document.getElementById('f-rsi-overbought').value),
    bb_period: parseInt(document.getElementById('f-bb-period').value),
    bb_std: parseFloat(document.getElementById('f-bb-std').value),
    adx_period: parseInt(document.getElementById('f-adx-period').value),
    adx_threshold: parseFloat(document.getElementById('f-adx-threshold').value),
  };
  const res = await fetch('/api/bots', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
  if (!res.ok) { alert('Erro ao criar bot: ' + await res.text()); return; }
  loadBots();
}

function strategyLabel(id) {
  const info = strategies.find(s => s.id === id);
  return info ? info.name : id;
}

async function loadBots() {
  const bots = await fetch('/api/bots').then(r => r.json());
  const body = document.getElementById('bots-body');
  body.innerHTML = bots.map(b => {
    const info = strategies.find(s => s.id === b.strategy);
    const regimeClass = info && info.regime === 'tendência' ? 'trend' : 'range';
    const adxText = b.current_adx != null ? b.current_adx.toFixed(1) : '—';
    const adxClass = b.trading_active ? 'active' : '';
    const hasPosition = b.position_qty > 0;
    const adxHint = b.trading_active == null
      ? 'aguardando dados'
      : b.trading_active
        ? 'filtro liberado pra novas entradas'
        : hasPosition
          ? 'filtro bloqueia novas entradas (saída da posição atual continua livre)'
          : 'filtro bloqueando novas entradas';
    return `
    <tr class="bot-row" onclick="openDetail(${b.id})">
      <td>${b.symbol} <span style="color:var(--muted);font-size:11px">${b.timeframe}</span></td>
      <td>${strategyLabel(b.strategy)}<span class="regime-tag ${regimeClass}">${info ? info.regime : ''}</span></td>
      <td class="adx-tag ${adxClass}" title="${adxHint}">${adxText}</td>
      <td><span class="badge ${b.status}">${b.status}</span></td>
      <td>$${b.equity.toFixed(2)}</td>
      <td class="${b.pnl >= 0 ? 'pos' : 'neg'}">${b.pnl >= 0 ? '+' : ''}${b.pnl.toFixed(2)} (${b.pnl_pct.toFixed(2)}%)</td>
      <td onclick="event.stopPropagation()">
        ${b.status === 'running'
          ? `<button class="secondary" onclick="toggleBot(${b.id}, false)">pausar</button>`
          : `<button class="secondary" onclick="toggleBot(${b.id}, true)">retomar</button>`}
        <button class="danger" onclick="removeBot(${b.id})">excluir</button>
      </td>
    </tr>`;
  }).join('');
}

async function toggleBot(id, resume) {
  await fetch(`/api/bots/${id}/${resume ? 'resume' : 'pause'}`, { method: 'POST' });
  loadBots();
}

async function removeBot(id) {
  if (!confirm('Excluir este bot e seu histórico?')) return;
  await fetch(`/api/bots/${id}`, { method: 'DELETE' });
  closeDetail();
  loadBots();
}

let currentDetailId = null;

async function openDetail(id) {
  currentDetailId = id;
  const data = await fetch(`/api/bots/${id}`).then(r => r.json());
  document.getElementById('detail').style.display = 'block';
  document.getElementById('detail-title').textContent = `${data.bot.symbol} — histórico`;

  const labels = data.equity.map(e => new Date(e.created_at + 'Z').toLocaleString());
  const values = data.equity.map(e => e.equity);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('equity-chart'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Equity (USDT)', data: values, borderColor: '#4f8cff', tension: 0.2, pointRadius: 0 }] },
    options: { animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false } } }
  });

  await renderPriceChart(data.bot, data.trades);

  document.getElementById('trades-body').innerHTML = data.trades.map(t => `
    <tr>
      <td>${new Date(t.created_at + 'Z').toLocaleString()}</td>
      <td class="${t.side === 'buy' ? 'pos' : 'neg'}">${t.side} <span style="color:var(--muted);font-size:11px">${t.reason || ''}</span></td>
      <td>$${formatPrice(t.price)}</td>
      <td>${t.qty.toFixed(6)}</td>
      <td class="${t.pnl >= 0 ? 'pos' : 'neg'}">${t.pnl != null ? t.pnl.toFixed(2) : '—'}</td>
    </tr>`).join('');
}

async function renderPriceChart(bot, trades) {
  let candles;
  try {
    candles = await fetch(`/api/bots/${bot.id}/candles`).then(r => r.json());
  } catch (e) {
    candles = [];
  }
  if (priceChart) { priceChart.destroy(); priceChart = null; }
  if (!Array.isArray(candles) || candles.length === 0) return;

  const halfCandle = (TIMEFRAME_MS[bot.timeframe] || 300e3) / 2;
  const labels = candles.map(c => new Date(c.time).toLocaleString());
  const closes = candles.map(c => c.close);

  const buyPoints = new Array(candles.length).fill(null);
  const sellPoints = new Array(candles.length).fill(null);
  for (const t of trades) {
    const tradeTime = new Date(t.created_at + 'Z').getTime();
    let bestIdx = -1, bestDiff = Infinity;
    candles.forEach((c, i) => {
      const diff = Math.abs(c.time - tradeTime);
      if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
    });
    if (bestIdx >= 0 && bestDiff <= halfCandle * 3) {
      if (t.side === 'buy') buyPoints[bestIdx] = t.price;
      else sellPoints[bestIdx] = t.price;
    }
  }

  priceChart = new Chart(document.getElementById('price-chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Preço', data: closes, borderColor: '#8b93a3', borderWidth: 1.5, tension: 0.15, pointRadius: 0 },
        { label: 'Compra', data: buyPoints, borderColor: 'transparent', backgroundColor: '#2ecc71',
          pointStyle: 'triangle', pointRadius: buyPoints.map(v => v != null ? 7 : 0), showLine: false },
        { label: 'Venda', data: sellPoints, borderColor: 'transparent', backgroundColor: '#ff5c5c',
          pointStyle: 'rectRot', pointRadius: sellPoints.map(v => v != null ? 7 : 0), showLine: false },
      ],
    },
    options: {
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { ticks: { callback: (v) => formatPrice(v) } },
      },
    },
  });
}

function closeDetail() {
  document.getElementById('detail').style.display = 'none';
  currentDetailId = null;
  if (priceChart) { priceChart.destroy(); priceChart = null; }
}

(async function init() {
  await loadStrategies();
  await loadSymbols();
  await loadBots();
  setInterval(() => { loadBots(); if (currentDetailId) openDetail(currentDetailId); }, 2000);
})();
</script>
</body>
</html>
