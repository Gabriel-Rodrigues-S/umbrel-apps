<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Favicon do Crypto Paper Bot. Deriva do icon.svg do manifesto, mas com
       traço mais grosso e sem os pontos pequenos: a 16x16 os detalhes finos
       do original viram borrão. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <polyline points="22,92 50,64 70,80 106,34" fill="none" stroke="#4f8cff"
            stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="80,34 106,34 106,60" fill="none" stroke="#2ecc71"
            stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
