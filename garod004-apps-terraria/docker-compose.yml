version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: garod004-apps-terraria_server_1
      APP_PORT: 7878

  server:
    image: ghcr.io/gabriel-rodrigues-s/terraria:1.0.0
    restart: on-failure
    # Tempo para salvar o mundo e fazer o backup de desligamento antes do Docker matar o processo.
    stop_grace_period: 2m
    # O jogo não é HTTP, então não passa pelo app_proxy: a porta 7777 é publicada direto no host
    # (acessível pela rede local e pelo Tailscale). O painel (7878) segue pelo app_proxy.
    ports:
      - 7777:7777
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ENDERECO_CONEXAO: 100.105.78.112
      MAX_JOGADORES: "8"
      BACKUP_HORAS: "6"
      BACKUPS_MANTER: "30"
      SENHA_MUNDO: ""
      TZ: America/Manaus
