manifestVersion: 1
id: garod004-apps-radar-quant
name: Radar Quant
tagline: Busca em todo o mercado, screener, curto prazo e notícias com evidência estatística
icon: https://raw.githubusercontent.com/Gabriel-Rodrigues-S/umbrel-apps/main/garod004-apps-radar-quant/icon.svg
category: finance
version: '1.1.0'
port: 8430
description: >-
  Radar estatístico de mercados: pesquise qualquer papel da B3 e dos EUA e as
  principais criptomoedas, veja gráficos interativos em doze intervalos (de 1
  minuto a 1 ano), notícias por ativo e um score calculado a partir de indicadores
  estatísticos, sempre acompanhado da evidência que o sustenta. Inclui screener
  pré-analisado dos índices (IBrA, Ibovespa, S&P 500 e Nasdaq-100), setups de
  curto prazo (swing), ranking dos ativos monitorados e sugestão de carteira. Os
  dados vêm de fontes públicas e as análises são apenas informativas: o Radar
  Quant não é recomendação profissional de investimento, e as decisões são sempre
  de responsabilidade de quem investe.
