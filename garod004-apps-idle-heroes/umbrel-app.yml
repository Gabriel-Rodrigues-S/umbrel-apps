description: >-
  CRUD pessoal para acompanhar contas de Idle Heroes: catálogo de heróis,
  habilidades e pivôs, medições datadas, casinhas e testes. O app não traz dados
  do jogo; o catálogo é importado pelo usuário e fica só no armazenamento do app.
  Interface própria com comparação de heróis entre contas (gráfico de evolução
  e ficha lado a lado), sessão de medição e cadastro; a API segue em /docs.
