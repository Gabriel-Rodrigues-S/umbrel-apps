releaseNotes: >-
  1.1.0: interface própria. Tela de comparação (gráfico por datas reais ou por tempo de conta,
  ficha lado a lado com diferenças destacadas), tela de nova sessão de medição e tela de dados.
  Medições ganham armadura, Transição do Destino, sublimação, equipamento, estrelas, Hero
  Resonance e artefato; contas ganham data de criação. O banco existente é migrado sozinho.
